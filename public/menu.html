<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Menu</title>
<meta name="theme-color" content="#0b2545"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/app.css">
<style>
 body{background:#f6f7f9} .mw{max-width:760px;margin:auto;padding-bottom:110px}
 .hd{background:linear-gradient(150deg,var(--navy),#16406f);color:#fff;padding:22px 18px 18px} .hd .lg{width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;color:var(--brand);font-weight:900;font-size:22px;flex:none} .hd .lg img{width:100%;height:100%;object-fit:cover}
 .hd h1{margin:0;font-size:22px} .hd .s{color:#cbd5e1;font-size:13px}
 .ban{background:#fef3c7;color:#78350f;padding:10px 16px;font-weight:600;font-size:13.5px}
 .cbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
 .sec{padding:14px 12px 4px} .sec h2{font-size:17px;margin:6px 4px 10px}
 .item{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
 .item .im{width:92px;height:92px;border-radius:12px;background:linear-gradient(135deg,#e6f4f2,#dbe7f3);flex:none;overflow:hidden;display:grid;place-items:center;font-weight:800;color:var(--brand);font-size:24px} .item .im img{width:100%;height:100%;object-fit:cover}
 .item .nm{font-weight:700;font-size:15px} .item .ds{color:var(--muted);font-size:12.5px;margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .item .pr{font-weight:800;color:var(--navy)} .item .add{margin-left:auto;align-self:flex-end}
 .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(92vw,720px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;box-shadow:var(--sh2);border:none;cursor:pointer;font-size:15px}
 .kiosk .item{padding:16px} .kiosk .item .im{width:130px;height:130px} .kiosk .item .nm{font-size:19px} .kiosk .chip{font-size:16px;padding:10px 18px}
 .strike{text-decoration:line-through;color:var(--muted);font-weight:500;font-size:12px;margin-left:6px}
</style></head><body>
<div class="mw" id="app"><div class="loading"><span class="spin"></span></div></div>
<script src="/js/lib.js"></script><script src="/js/menu.js"></script></body></html>
