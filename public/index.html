<style>

 .pb>div{padding:18px 20px} .pb .p{background:#fff7f7;border-right:1px solid var(--line)} .pb .s{background:#f0fbf8}
 .pb .p b{color:#b91c1c} .pb .s b{color:var(--brand)} .pb small{display:block;color:#475569;font-size:14.5px;margin-top:4px;line-height:1.55}
 @media(max-width:860px){.pgrid2{grid-template-columns:1fr}} @media(max-width:480px){.pb{grid-template-columns:1fr}.pb .p{border-right:none;border-bottom:1px solid var(--line)}}

 .mod h3{margin:0 0 4px;font-size:18px} .mod p{color:var(--muted);margin:0 0 10px;font-size:14.5px}

 @media(max-width:900px){.gal{grid-template-columns:repeat(2,1fr)}} @media(max-width:560px){.gal{grid-template-columns:1fr}}
 .steps2{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
 .st2{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;counter-increment:s;position:relative}
 .st2:before{content:counter(s);width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font:800 17px Inter;display:grid;place-items:center;margin-bottom:12px}
 .st2 h3{margin:0 0 6px;font-size:17px} .st2 p{margin:0;color:var(--muted);font-size:14.5px}
 @media(max-width:900px){.steps2{grid-template-columns:repeat(2,1fr)}} @media(max-width:520px){.steps2{grid-template-columns:1fr}}
 .aud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center} .aud span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:600}
 .prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:1080px;margin:0 auto}
 .pc{background:#fff;border:2px solid var(--line);border-radius:20px;padding:24px 22px;position:relative;display:flex;flex-direction:column}
 .pc.best{border-color:var(--brand);box-shadow:0 20px 50px rgba(15,118,110,.18)}
 .pc .bdg{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-weight:700;font-size:12.5px;padding:3px 12px;border-radius:999px;white-space:nowrap}
 .pc h3{margin:0 0 10px;font-size:18px} .pc .amt{font:800 34px Inter,Hind;color:var(--navy);letter-spacing:-.02em} .pc .pm{color:var(--muted);font-size:14px;margin-top:2px}
 .pc .save{display:inline-block;background:#dcfce7;color:#15803d;font-weight:700;font-size:12.5px;padding:2px 10px;border-radius:999px;margin-top:8px}
 .pc .btn{margin-top:auto} .pc .spacer{flex:1;min-height:16px}
 .feat-all{max-width:900px;margin:26px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px}
 .feat-all ul{columns:3;column-gap:24px;margin:8px 0 0;padding-left:18px} .feat-all li{margin-bottom:5px;font-size:14.5px}
 @media(max-width:760px){.feat-all ul{columns:2}} @media(max-width:460px){.feat-all ul{columns:1}}
 .dls{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;max-width:980px;margin:0 auto}
 .dl{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;gap:16px;align-items:flex-start}
 .dl .ic{flex:none;width:54px;height:66px;border-radius:8px;background:linear-gradient(160deg,#ef4444,#b91c1c);color:#fff;display:grid;place-items:center;font:800 13px Inter;box-shadow:0 6px 14px rgba(185,28,28,.25)}
 .dl h3{margin:0 0 4px;font-size:16.5px} .dl p{margin:0 0 10px;color:var(--muted);font-size:14px}
 .faq2{max-width:820px;margin:auto} .faq2 details{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;background:#fff}
 .faq2 summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px} .faq2 summary::-webkit-details-marker{display:none}
 .faq2 summary:after{content:"+";font-size:20px;color:var(--brand);line-height:1} .faq2 details[open] summary:after{content:"−"} .faq2 p{margin:10px 0 0;color:#475569}
 .contact{background:linear-gradient(135deg,var(--brand),#0b5d57);color:#fff;border-radius:24px;padding:40px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
 .contact h2{color:#fff;text-align:left;margin:0 0 8px} .contact p{color:#d6f3ee;margin:0}
 .contact .ways{display:flex;flex-direction:column;gap:10px} .contact .ways a{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;text-decoration:none!important;display:flex;gap:10px;align-items:center;word-break:break-all}
 @media(max-width:760px){.contact{grid-template-columns:1fr;padding:28px 22px}}
 footer{background:var(--navy);color:#94a3b8;padding:34px 0;font-size:14px} footer a{color:#cbd5e1}
 footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
 .ann{background:#fef3c7;color:#78350f;text-align:center;padding:9px 16px;font-weight:600;font-size:13.5px}
 .zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;cursor:zoom-out}
 .zoom img{max-width:100%;max-height:100%;border-radius:10px}
 .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s} .reveal.in{opacity:1;transform:none}
 @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
</style></head><body>
<div id="ann"></div>
<div class="nav-top"><div class="wrap">
  <a class="lg" href="/" id="lg"></a>
  <div class="langsw" id="langsw"><button data-l="bn">বাংলা</button><button data-l="en">EN</button></div>
  <button class="btn ghost icon burger2" id="bg2" aria-label="Menu">☰</button>
  <nav class="navlinks" id="nl"><a class="l" href="#features" data-t="nav_features"></a><a class="l" href="#pricing" data-t="nav_pricing"></a><a class="l" href="#downloads" data-t="nav_downloads"></a><a class="l" href="#faq" data-t="nav_faq"></a>
    <a class="btn" href="/login" data-t="login"></a><a class="btn primary" href="/signup" id="navcta" data-t="start"></a></nav>
</div></div>
<div id="page"><div class="loading" style="padding:120px"><span class="spin"></span></div></div>
<div class="zoom" id="zoom"><img alt=""></div>
<script src="/js/lib.js"></script>
<script>
const UI = {
  en: { nav_features: 'Features', nav_pricing: 'Pricing', nav_downloads: 'Downloads', nav_faq: 'FAQ', login: 'Log in', start: 'Start free', month: 'month', per_month: '/ month', for_period: 'for', trial: '-day free trial', choose: 'Start free trial', save: 'Save', all_features: 'Every plan includes all features', download: 'Download', view: 'View', mb: 'MB', manual: 'User manual', brochure: 'Brochure', other: 'Document', lang_en: 'English', lang_bn: 'Bangla', lang_both: 'English & Bangla', call: 'Call', whatsapp: 'WhatsApp', email: 'Email', nodl: 'Files will be available soon.', contact: 'Contact', signups_closed: 'Contact us' },
  bn: { nav_features: 'ফিচার', nav_pricing: 'মূল্য', nav_downloads: 'ডাউনলোড', nav_faq: 'প্রশ্নোত্তর', login: 'লগইন', start: 'ফ্রি শুরু করুন', month: 'মাস', per_month: '/ মাস', for_period: '', trial: ' দিনের ফ্রি ট্রায়াল', choose: 'ফ্রি ট্রায়াল শুরু করুন', save: 'সাশ্রয়', all_features: 'প্রতিটি প্যাকেজে সব ফিচার', download: 'ডাউনলোড', view: 'দেখুন', mb: 'এমবি', manual: 'ইউজার ম্যানুয়াল', brochure: 'ব্রোশিউর', other: 'ডকুমেন্ট', lang_en: 'ইংরেজি', lang_bn: 'বাংলা', lang_both: 'বাংলা ও ইংরেজি', call: 'কল করুন', whatsapp: 'হোয়াটসঅ্যাপ', email: 'ইমেইল', nodl: 'ফাইল শীঘ্রই আসছে।', contact: 'যোগাযোগ', signups_closed: 'যোগাযোগ করুন' }
};
const BN_DIG = '০১২৩৪৫৬৭৮৯';
const bnNum = (s, lang) => lang === 'bn' ? String(s).replace(/\d/g, d => BN_DIG[d]) : String(s);
let SITE = null, DLS = [], LANG = 'bn';
const params = new URLSearchParams(location.search);
async function start() {
  [SITE, DLS] = await Promise.all([GET('/api/public/site'), GET('/api/public/downloads').catch(() => [])]);
  let saved = null; try { saved = localStorage.getItem('bx_lang'); } catch (e) { }
  try { localStorage.setItem('bx_site_def', SITE.default_lang || 'bn'); } catch (e) { }
  LANG = ['bn', 'en'].includes(params.get('lang')) ? params.get('lang') : saved || SITE.default_lang || 'bn';
  render();
}
function setLang(l) { LANG = l; try { localStorage.setItem('bx_lang', l); } catch (e) { } render(); }
function money(v) { const n = Number(v) || 0; return bnNum((SITE.brand.currency || '৳') + n.toLocaleString('en-IN'), LANG); }
function render() {
  const s = SITE, b = s.brand, L = s.landing[LANG] || s.landing.en, P = s.plan, U = UI[LANG];
  CUR = b.currency || '৳';
  document.documentElement.lang = LANG;
  document.title = (LANG === 'bn' ? s.seo.title_bn : s.seo.title) || b.name;
  document.querySelector('meta[name=description]').content = (LANG === 'bn' ? s.seo.description_bn : s.seo.description) || '';
  if (b.color) document.documentElement.style.setProperty('--brand', b.color);
  $('#lg').innerHTML = b.logo_id ? `<img class="m" src="/f/${b.logo_id}" alt=""><span class="tx">${esc(b.name)}</span>` : `<img class="m" src="/img/mark_color.png" alt=""><img class="w" src="/img/word_color.png" alt="Baybex">`;
  $$('[data-t]').forEach(x => x.textContent = U[x.dataset.t]);
  $$('#langsw button').forEach(x => x.classList.toggle('on', x.dataset.l === LANG));
  if (!s.signup_enabled) { $('#navcta').href = 'tel:' + b.phone; $('#navcta').textContent = U.signups_closed; }
  $('#ann').innerHTML = (s.announcements || []).map(a => `<div class="ann">${esc(a.title)}${a.body ? ' — ' + esc(a.body) : ''}</div>`).join('');
  const per = P.periods || []; const monthly = per.find(x => Number(x.months) === 1);
  const signupUrl = m => s.signup_enabled ? `/signup?period=${m}` : 'tel:' + b.phone;
  const priceCards = per.map((p, i) => {
    const pm = p.months ? p.price / p.months : p.price;
    const save = monthly && p.months > 1 ? Math.round((1 - pm / monthly.price) * 100) : 0;
    const badge2 = LANG === 'bn' ? p.badge_bn : p.badge_en;
    return `<div class="pc ${badge2 ? 'best' : ''} reveal">${badge2 ? `<div class="bdg">${esc(badge2)}</div>` : ''}<h3>${esc(LANG === 'bn' ? p.label_bn : p.label_en)}</h3>
      <div class="amt">${money(p.price)}</div><div class="pm">${p.months > 1 ? `≈ ${money(Math.round(pm))} ${U.per_month}` : U.per_month.replace('/ ', '/')}</div>
      ${save > 0 ? `<div><span class="save">${U.save} ${bnNum(save, LANG)}%</span></div>` : ''}<div class="spacer"></div>
      <a class="btn ${badge2 ? 'primary' : ''} block" href="${signupUrl(p.months)}">${s.signup_enabled ? U.choose : U.signups_closed}</a></div>`;
  }).join('');
  const feats = (LANG === 'bn' ? P.features_bn : P.features) || [];
  const dlCards = DLS.length ? DLS.map(d => {
    const title = (LANG === 'bn' ? d.title_bn : d.title_en) || d.title_en || d.title_bn; const desc = LANG === 'bn' ? d.desc_bn : d.desc_en;
    const href = `/d/${d.id}/${encodeURIComponent(d.filename || 'file.pdf')}`;
    return `<div class="dl reveal"><div class="ic">PDF</div><div style="min-width:0;flex:1"><h3>${esc(title)}</h3><p>${esc(desc || '')}</p>
      <div class="row" style="gap:6px;margin-bottom:10px"><span class="badge brand">${U[d.kind] || U.other}</span><span class="badge">${U['lang_' + d.lang] || ''}</span><span class="badge">${bnNum((d.size / 1048576).toFixed(1), LANG)} ${U.mb}</span></div>
      <div class="row" style="gap:8px"><a class="btn primary sm" href="${href}">⬇ ${U.download}</a><a class="btn sm" href="${href}?view=1" target="_blank" rel="noopener">${U.view}</a></div></div></div>`;
  }).join('') : `<p class="muted center">${U.nodl}</p>`;
  const phone = String(b.phone || '').replace(/[^\d+]/g, ''); const wa = phone ? 'https://wa.me/' + (phone.startsWith('+') ? phone.slice(1) : phone.startsWith('0') ? '88' + phone : phone) : '';
  const shots = (L.shots || []).filter(x => x.img);
  $('#page').innerHTML = `
  <section class="hero"><div class="wrap grid2">
    <div style="padding-bottom:48px"><span class="badge2">${esc(L.hero_badge)}</span><h1>${esc(L.hero_title)} <span>${esc(L.hero_highlight || '')}</span></h1>
      <p class="sub">${esc(L.hero_sub)}</p>
      <div class="row"><a class="btn primary lg" href="${s.signup_enabled ? '/signup' : 'tel:' + b.phone}">${esc(L.cta_primary)}</a><a class="btn lg" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.35)" href="/login">${esc(L.cta_secondary)}</a></div>
      <div class="note">${esc(L.hero_note || '')}${P.trial_days ? ` · ${bnNum(P.trial_days, LANG)}${U.trial}` : ''}</div></div>
    <div style="position:relative;align-self:end"><div class="shot"><img src="/img/landing/dashboard.jpg" alt=""></div><div class="phone-float"><img src="/img/landing/menu.jpg" alt=""></div></div>
  </div></section>
  <div class="stats"><div class="wrap">${(L.stats || []).map(x => `<div class="stat"><b>${esc(x.value)}</b><span>${esc(x.label)}</span></div>`).join('')}</div></div>
  <section class="sec"><div class="wrap"><h2>${esc(L.problems_title)}</h2><p class="sub">${esc(L.problems_sub || '')}</p>
    <div class="pgrid2">${(L.problems || []).map(x => `<div class="pb reveal"><div class="p"><b>✕</b> <strong>${esc(x.problem)}</strong></div><div class="s"><small><b>✓</b> ${esc(x.solution)}</small></div></div>`).join('')}</div></div></section>
  <section class="sec alt" id="features"><div class="wrap"><h2>${esc(L.modules_title)}</h2><p class="sub">${esc(L.modules_sub || '')}</p>
    <div class="mods">${(L.modules || []).map(m => `<div class="mod reveal"><div class="i">${esc(m.icon || '✓')}</div><h3>${esc(m.title)}</h3><p>${esc(m.text || '')}</p><ul>${(m.bullets || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></div></section>
  ${shots.length ? `<section class="sec"><div class="wrap"><h2>${esc(L.shots_title)}</h2><div class="gal" style="margin-top:30px">${shots.map(x => `<figure class="reveal"><img src="/img/landing/${esc(x.img)}.jpg" alt="${esc(x.caption)}" loading="lazy"><figcaption>${esc(x.caption)}</figcaption></figure>`).join('')}</div></div></section>` : ''}
  <section class="sec alt"><div class="wrap"><h2>${esc(L.steps_title)}</h2><div class="steps2" style="margin-top:30px">${(L.steps || []).map(x => `<div class="st2 reveal"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>
    <h2 style="margin-top:56px;font-size:24px">${esc(L.audience_title)}</h2><div class="aud" style="margin-top:16px">${(L.audience || []).map(x => `<span>${esc(x)}</span>`).join('')}</div></div></section>
  <section class="sec" id="pricing"><div class="wrap"><h2>${esc(L.pricing_title)}</h2><p class="sub">${esc(L.pricing_sub || '')}${P.trial_days ? `<br><b style="color:var(--brand)">${bnNum(P.trial_days, LANG)}${U.trial}</b>` : ''}</p>
    <div class="prices">${priceCards}</div>
    <div class="feat-all reveal"><b>${esc((LANG === 'bn' ? P.name_bn : P.name) || P.name)}</b> — ${U.all_features}<div class="muted small">${esc((LANG === 'bn' ? P.note_bn : P.note) || '')}</div><ul>${feats.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div></div></section>
  <section class="sec alt" id="downloads"><div class="wrap"><h2>${esc(L.downloads_title)}</h2><p class="sub">${esc(L.downloads_sub || '')}</p><div class="dls">${dlCards}</div></div></section>
  <section class="sec" id="faq"><div class="wrap"><h2>${esc(L.faq_title)}</h2><div class="faq2" style="margin-top:30px">${(L.faq || []).map(f => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}</div></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap"><div class="contact"><div><h2>${esc(L.contact_title)}</h2><p>${esc(L.contact_text || '')}</p></div>
    <div class="ways">${b.phone ? `<a href="tel:${esc(b.phone)}">📞 ${U.call}: ${esc(bnNum(b.phone, LANG))}</a>` : ''}${wa ? `<a href="${wa}" target="_blank" rel="noopener">💬 ${U.whatsapp}</a>` : ''}${b.email ? `<a href="mailto:${esc(b.email)}">✉️ ${esc(b.email)}</a>` : ''}</div></div></div></section>
  <footer><div class="wrap"><div><div class="lg" style="color:#fff">${b.logo_id ? `<img class="m" src="/f/${b.logo_id}" style="height:32px">` : `<img class="m" src="/img/mark_white.png" style="height:32px"><img class="w" src="/img/word_white.png" style="height:16px">`}</div>
    <div class="mt">${esc(L.footer_text || b.footer || '')}</div></div><div>${[b.phone && '📞 ' + esc(b.phone), b.email && '✉️ ' + esc(b.email), b.website && '🌐 ' + esc(b.website)].filter(Boolean).join(' &nbsp; ')}</div></div></footer>`;
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -40px 0px' }) : null;
  $$('.reveal').forEach(x => io ? io.observe(x) : x.classList.add('in'));
  $$('.gal img').forEach(im => im.onclick = () => { $('#zoom img').src = im.src; $('#zoom').style.display = 'flex'; });
}
$('#zoom').onclick = () => { $('#zoom').style.display = 'none'; };
$$('#langsw button').forEach(x => x.onclick = () => setLang(x.dataset.l));
$('#bg2').onclick = () => $('#nl').classList.toggle('open');
$('#nl').addEventListener('click', e => { if (e.target.closest('a')) $('#nl').classList.remove('open'); });
start().catch(e => { $('#page').innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
</script></body></html>
